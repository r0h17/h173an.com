<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>h173an.com</title>
<style>
  :root {
    --bg:   #fbfbf9;
    --fg:   #17171a;
    --mut:  #6b6b73;
    --line: #e4e4de;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:   #121214;
      --fg:   #ececef;
      --mut:  #8b8b94;
      --line: #2a2a2e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }
  main { width: 100%; max-width: 30rem; }
  h1 {
    margin: 0 0 .3rem;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -.02em;
  }
  p { margin: 0; color: var(--mut); }
  hr {
    border: 0;
    border-top: 1px solid var(--line);
    margin: 2rem 0 1.25rem;
  }
  .meta {
    font-size: .8125rem;
    color: var(--mut);
    display: flex;
    flex-wrap: wrap;
    gap: .4rem .75rem;
  }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .8125rem;
  }
</style>
</head>
<body>
  <main>
    <h1>h173an.com</h1>
    <p>Personal domain. Nothing to see here yet.</p>
    <hr>
    <div class="meta">
      <span>Static site on GitHub Pages</span>
      <span><code>.well-known</code> verification host</span>
    </div>
  </main>
</body>
</html>
